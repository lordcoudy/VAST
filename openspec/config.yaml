schema: spec-driven

# Shown to the assistant when creating OpenSpec artifacts.
context: |
  Spec-Driven Development is mandatory in this repo.
  Cycle: spec → Draft MR → spec review → implement in the same MR → CI → archive → final review → merge.
  Do not edit production code until the change spec is approved in the MR.
  Do not merge without a committed archive of the change in that same MR.
  One change name, one branch, one MR.
  Follow AGENTS.md and the OpenSpec skills in .agents/skills/.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
