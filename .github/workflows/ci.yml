name: VAST CPU checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
      OPENSPEC_TELEMETRY: '0'
    steps:
      - name: Check out the actual PR head or push commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve exact source bytes
        run: git config core.autocrlf false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '25.2.1'
      - name: Install the agreed OpenSpec version in this ephemeral runner
        run: npm install --global @fission-ai/openspec@1.13.0
      - name: Validate OpenSpec structure, including completed archives
        run: |
          openspec validate --all --strict --no-interactive
          openspec validate --archived --strict --no-interactive
      - name: Install CPU build prerequisites in this ephemeral runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install the recorded CPU test dependencies
        run: python -m pip install --no-deps --requirement .ci/requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Check source, build six CPU targets and execute test discovery
        run: python -B scripts/run_ci_checks.py --expected-commit "${{ github.event.pull_request.head.sha || github.sha }}" --output-dir "$RUNNER_TEMP/vast-cpu-checks"
      - name: Preserve original CPU logs and explicit hardware gaps
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vast-cpu-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/vast-cpu-checks
          if-no-files-found: warn
          retention-days: 7
